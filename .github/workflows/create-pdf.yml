name: Build All Markdown PDFs

on: [push]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc wkhtmltopdf poppler-utils

      - name: Create output folders
        run: |
          mkdir -p outputs/pdf outputs/png

      # Loop through ALL markdown files
      - name: Build PDFs from all Markdown files
        run: |
          find . -name "*.md" ! -path "./.github/*" | while read file; do
            echo "Processing $file"

            # Create safe filename
            base=$(basename "$file" .md)
            safe_name=$(echo "$base" | tr ' ' '-' | tr '[:upper:]' '[:lower:]')

            # Transform callouts
            sed -E '
            s/^> \[!NOTE\]/<div class="note"><strong>Note:<\/strong>/;
            s/^> \[!TIP\]/<div class="tip"><strong>Tip:<\/strong>/;
            s/^> \[!WARNING\]/<div class="warning"><strong>Warning:<\/strong>/;
            s/^> ?(.*)$/\1<\/div>/;
            ' "$file" > temp.md

            # Convert to HTML
            pandoc temp.md \
              -o temp.html \
              --css=styles.css \
              --metadata title="$base"

            # Convert to PDF
            wkhtmltopdf temp.html "outputs/pdf/$safe_name.pdf"

            # Convert to PNG
            pdftoppm -png -singlefile -r 200 \
              "outputs/pdf/$safe_name.pdf" \
              "outputs/png/$safe_name"

          done

      - name: Commit generated files
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add outputs/pdf outputs/png || true

          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Auto-generate PDFs for all markdown files"
            git push
          fi
