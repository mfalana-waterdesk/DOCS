name: Build All Markdown PDFs

on: [push]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc wkhtmltopdf poppler-utils

      - name: Create output folders
        run: |
          mkdir -p outputs/pdf outputs/png

      - name: Build PDFs from all Markdown files
        run: |
          find . -name "*.md" \
            ! -path "./.github/*" \
            ! -path "./outputs/*" \
            ! -name "*-0.md" | while read file; do

            echo "Processing $file"

            dir=$(dirname "$file")
            base=$(basename "$file" .md)

            # ✅ Unique filename (prevents collisions)
            safe_name=$(echo "$file" | sed 's|^\./||' | tr ' /' '-' | tr '[:upper:]' '[:lower:]' | tr -cd '[:alnum:]-')

            cd "$dir"

            # ✅ Convert GitHub callouts to styled HTML
            sed -E '
            s/^> \[!NOTE\]/<div class="note"><strong>Note:<\/strong>/;
            s/^> \[!TIP\]/<div class="tip"><strong>Tip:<\/strong>/;
            s/^> \[!WARNING\]/<div class="warning"><strong>Warning:<\/strong>/;
            s/^> ?(.*)$/\1<\/div>/;
            ' "$(basename "$file")" > temp.md

            # ✅ Try conversion — skip on failure
            if pandoc -f gfm temp.md \
                -o temp.html \
                --css=../styles.css \
                --metadata title="$base"; then

              echo "✔ Converted $file"

              pdf_path="../outputs/pdf/$safe_name.pdf"

              # ✅ Generate PDF
              if wkhtmltopdf --enable-local-file-access temp.html "$pdf_path"; then
                echo "✔ PDF created"

                # ✅ Generate PNG only if PDF exists
                if [ -f "$pdf_path" ]; then
                  pdftoppm -png -singlefile -r 200 \
                    "$pdf_path" \
                    "../outputs/png/$safe_name"
                else
                  echo "⚠ PDF missing, skipping PNG"
                fi

              else
                echo "❌ PDF generation failed for $file"
              fi

            else
              echo "❌ Skipping $file due to conversion error"
            fi

            cd - > /dev/null

          done

      - name: Commit generated files
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add outputs/pdf outputs/png || true

          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Auto-generate PDFs for all markdown files"
            git push
          fi
